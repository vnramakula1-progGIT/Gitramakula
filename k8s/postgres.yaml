# 1. SECRET: Stores the database password securely
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: app-namespace
type: Opaque
stringData:
  postgres-password: "kong_password"
---
# 2. HEADLESS SERVICE: Provides stable DNS entries for the StatefulSet pods
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: app-namespace
  labels:
    app: postgres
spec:
  ports:
    - port: 5432
      name: postgres
  selector:
    app: postgres
---
# 3. STATEFULSET: Manages the PostgreSQL pod lifecycle and storage
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: app-namespace
spec:
  serviceName: "postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      managed-by: kustomize
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine # Lightweight, production-grade image
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: kong
            - name: POSTGRES_USER
              value: kong_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: default
        resources:
          requests:
            storage: 10Gi
