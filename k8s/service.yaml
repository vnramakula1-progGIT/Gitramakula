apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: app-namespace
  labels:
    app: gitramakula
spec:
  type: LoadBalancer
  selector:
    app: gitramakula
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: app-service-internal
  namespace: app-namespace
  labels:
    app: gitramakula
spec:
  type: ClusterIP
  selector:
    app: gitramakula
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
