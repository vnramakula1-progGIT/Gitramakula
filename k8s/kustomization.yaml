apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-namespace

metadata:
  name: gitramakula-app

commonLabels:
  app: gitramakula
  managed-by: kustomize

resources:
- namespace.yaml
- configmap.yaml
- secrets.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- hpa.yaml
- pdb.yaml
- redis-statefulset.yaml
- rabbitmq-statefulset.yaml
- kong-ingress.yaml

replicas:
- name: app-deployment
  count: 3

images:
- name: nginx
  newTag: latest

vars:
- name: APP_NAME
  objref:
    kind: Deployment
    name: app-deployment
    apiVersion: apps/v1
  fieldref:
    fieldpath: metadata.name
