apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aks402ns

metadata:
  name: gitramakula-app

labels:
- pairs:
    managed-by: kustomize
  includeSelectors: false
  includeTemplates: true

resources:
- configmap.yaml
- secrets.yaml
- postgres.yaml
- redis-commander.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- hpa.yaml
- pdb.yaml
- redis-statefulset.yaml
- rabbitmq-statefulset.yaml
- kong-ingress.yaml

replicas:
- name: app-deployment
  count: 1

images:
- name: nginx
  newTag: latest

vars:
- name: APP_NAME
  objref:
    kind: Deployment
    name: app-deployment
    apiVersion: apps/v1
  fieldref:
    fieldpath: metadata.name
