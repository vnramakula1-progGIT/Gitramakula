apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-commander
  namespace: app-namespace
  labels:
    app: redis-commander
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-commander
      managed-by: kustomize
  template:
    metadata:
      labels:
        app: redis-commander
    spec:
      containers:
      - name: redis-commander
        image: rediscommander/redis-commander:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_HOSTS
          value: local:redis-service:6379:0:redispassword123
        ports:
        - name: http
          containerPort: 8081
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-commander
  namespace: app-namespace
  labels:
    app: redis-commander
spec:
  type: ClusterIP
  selector:
    app: redis-commander
  ports:
  - name: http
    port: 8081
    targetPort: http
    protocol: TCP
