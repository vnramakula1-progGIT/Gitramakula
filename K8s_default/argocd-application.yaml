apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitramakula
  namespace: argocd
spec:
  project: tenant-aks402ns
  source:
    repoURL: https://github.com/vnramakula1-progGIT/Gitramakula.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: aks402ns
  syncPolicy:
    automated:
      enabled: true
      prune: false
