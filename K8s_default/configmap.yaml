apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
  labels:
    app: gitramakula
data:
  environment: "production"
  log_level: "info"
  app_version: "1.0.0"
  database_host: "db.example.com"
  api_endpoint: "https://api.example.com"
  # Multi-line configuration example
  app.conf: |
    server {
      listen 80;
      server_name app.example.com;
      location / {
        proxy_pass http://localhost:8080;
      }
    }
